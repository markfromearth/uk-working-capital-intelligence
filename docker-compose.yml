version: "3.8"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: uk_working_capital_app
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=${ENVIRONMENT:-production}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - SECRET_KEY=${SECRET_KEY:?SECRET_KEY must be set in environment}
      - AUDIT_CHECKPOINT_SECRET=${AUDIT_CHECKPOINT_SECRET:-}
      - DATABASE_URL=${DATABASE_URL:?DATABASE_URL must be set in environment}
      - DEMO_MODE=${DEMO_MODE:-false}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:15-alpine
    container_name: uk_working_capital_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-capital_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in environment}
      POSTGRES_DB: ${POSTGRES_DB:-working_capital}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-capital_user} -d ${POSTGRES_DB:-working_capital}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:
