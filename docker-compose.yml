version: "3.8"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: uk_working_capital_app
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - LOG_LEVEL=INFO
      - DATABASE_URL=postgresql://capital_user:capital_password@postgres:5432/working_capital
      - DEMO_MODE=true
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:15-alpine
    container_name: uk_working_capital_postgres
    environment:
      POSTGRES_USER: capital_user
      POSTGRES_PASSWORD: capital_password
      POSTGRES_DB: working_capital
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U capital_user -d working_capital"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:
